name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and build web
        run: |
          npm install --no-audit --no-fund esbuild@^0.28.0
          npm install --no-audit --no-fund --legacy-peer-deps
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npm run build

      - name: Setup Capacitor Android
        run: |
          rm -f capacitor.config.ts
          cat << 'CFG' > capacitor.config.json
          {
            "appId": "com.smartlearn.ai",
            "appName": "SmartLearn AI",
            "webDir": "dist"
          }
          CFG
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartLearn-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
